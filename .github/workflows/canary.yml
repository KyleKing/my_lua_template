name: Canary

# workflow_dispatch only for now: the children's template-adoption commits
# (`.copier-answers.yml` pointed at this template) are not yet pushed to
# GitHub, so a push-triggered canary would fail spuriously. Once the children
# are pushed, this should become a required pre-bump gate (e.g. triggered
# from bump_version.yml before tagging).
on:
  workflow_dispatch: null

permissions:
  contents: read

jobs:
  canary:
    name: Canary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          cache: true

      - name: Install Neovim
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: stable

      - name: Run canary
        run: python3 scripts/canary.py
