---
name: CI

"on":
  pull_request: null
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate:
    name: Generate (${{ matrix.project_type }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project_type: [mise-backend, nvim-config, nvim-plugin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Generate project (${{ matrix.project_type }})
        run: |
          uvx copier copy --trust --defaults \
            --data development_branch=main \
            --data project_name=test-template.nvim \
            --data "project_description=Generated in CI" \
            --data "author_name=Carl The Template" \
            --data author_email=ctt@ctt.ctt \
            --data author_username=user_ctt \
            --data project_type=${{ matrix.project_type }} \
            . "$RUNNER_TEMP/generated"

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        if: matrix.project_type != 'mise-backend'
        with:
          experimental: true
          cache: true

      - name: Install Neovim
        if: matrix.project_type != 'mise-backend'
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: stable

      - name: Install tools
        if: matrix.project_type != 'mise-backend'
        working-directory: ${{ runner.temp }}/generated
        run: |
          mise trust
          mise install

      - name: Run CI gates
        if: matrix.project_type == 'nvim-plugin'
        working-directory: ${{ runner.temp }}/generated
        run: mise run ci

      # nvim-config renders a test runner but no specs, so run only the
      # static gates here.
      - name: Run lint and typecheck
        if: matrix.project_type == 'nvim-config'
        working-directory: ${{ runner.temp }}/generated
        run: |
          mise run lint
          mise run typecheck

      - name: Validate hk config
        if: matrix.project_type != 'mise-backend'
        working-directory: ${{ runner.temp }}/generated
        run: mise exec -- pkl eval hk.pkl
